herename: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')
          URL="https://$OWNER.github.io/${{ github.event.repository.name }}/"
          mkdir www
          cat > www/offline.html <<'EOF'
          <!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لا اتصال</title></head><body style="font-family:sans-serif;text-align:center;padding:40px;background:#064e3b;color:#fff"><h1>📡 لا يوجد اتصال بالإنترنت</h1><p>اتصل بالإنترنت ثم أعد فتح التطبيق.</p></body></html>
          EOF
          cp www/offline.html www/index.html
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > capacitor.config.json <<EOF
          {"appId":"com.abdelaziz.science","appName":"علوم الطبيعة والحياة","webDir":"www","server":{"url":"$URL","errorPath":"offline.html"}}
          EOF
          npx cap add android
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
